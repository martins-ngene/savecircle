services:
  - type: web
    name: savecircle-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node scripts/start-production.js
    healthCheckPath: /api/blockchain/config
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: ticketchain-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STELLAR_NETWORK
        value: TESTNET
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: SAVECIRCLE_CONTRACT_ID
        value: CDSNM3LJEEDHPHKQBEUA5FS42SUMAWTEEKWHAIVWJYYYT6QY3B5HNYNB
      - key: USDC_TOKEN_CONTRACT_ID
        value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
      - key: INDEXER_ENABLED
        value: "true"
