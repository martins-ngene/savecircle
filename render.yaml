databases:
  - name: savecircle-db
    databaseName: savecircle
    user: savecircle_user
    plan: basic-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"

services:
  - type: web
    name: savecircle-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --workspace apps/backend --workspace packages/shared && npm run build --workspace packages/shared && npm run prisma:generate --workspace apps/backend && npm run backend:build
    startCommand: npm run start:render --workspace apps/backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: savecircle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STELLAR_NETWORK
        value: TESTNET
      - key: STELLAR_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: STELLAR_NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: SAVECIRCLE_CONTRACT_ID
        value: CDSNM3LJEEDHPHKQBEUA5FS42SUMAWTEEKWHAIVWJYYYT6QY3B5HNYNB
      - key: USDC_TOKEN_CONTRACT_ID
        value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
      - key: INDEXER_ENABLED
        value: "true"
